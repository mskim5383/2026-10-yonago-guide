<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 784" width="1000" height="784" role="img" aria-labelledby="cc-title cc-desc" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="cc-title">10/12·13·14 영업 캘린더</title>
<desc id="cc-desc">이 책 일정에 나오는 주요 장소의 10/12(월·공휴일), 10/13(화), 10/14(수) 영업 여부. O 영업, X 휴무, △ 부정기 휴무, ? 미확인. 칠한 칸은 이 책 일정에 넣은 날, 점선 칸은 선택·대안. 사카이미나토 어항 쪽(직매센터, HATONOVA)은 10/13 화요일에 쉬고, 碧と風는 10/12에 쉬고, 河田酒店은 10/14에 쉰다. 2026-10-09 기준 공식 사이트·Tabelog 표기.</desc>
