<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img" aria-labelledby="ck-title ck-desc" font-family="'Noto Sans KR','Noto Sans JP',sans-serif" lang="ko">
<title id="ck-title">간 온도 이름표 · 히나타칸에서 도비키리칸까지</title>
<desc id="ck-desc">일본술을 데우는 온도의 이름을 온도계 위에 정리한 도판. 히나타칸(日向燗) 약 30℃, 히토하다칸(人肌燗) 약 35℃, 누루칸(ぬる燗) 약 40℃, 조칸(上燗) 약 45℃, 아쓰칸(熱燗) 약 50℃, 도비키리칸(飛び切り燗) 약 55℃ 이상. 이름과 온도는 일반적인 구분이다. 오른쪽은 산인 술의 예: 우메쓰주조 冨玲는 아쓰칸 60~70℃(돗토리현 소개), 히오키자쿠라 鍛造生酛 強力은 뒷라벨이 도비키리칸 ◎·아쓰칸 ○(2019년 블로그 기록), 벤텐무스메는 아쓰칸으로 데운 뒤 약 42℃까지 식혀 마시는 冷ましの燗(판매점 제안).</desc>
