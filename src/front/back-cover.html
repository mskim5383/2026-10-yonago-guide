  <p class="bc-blurb">신이 바다 건너 땅을 끌어올 때 쓴 줄이 유미가하마(<span class="ja" lang="ja">弓ヶ浜</span>)이고, 그 줄을 맨 말뚝이 다이센(<span class="ja" lang="ja">大山</span>)이다. 숙소가 있는 사카이미나토(<span class="ja" lang="ja">境港</span>)는 그 줄의 끝이다. 이 책은 줄 위를 걷는 사흘을 위해 만들었다.</p>
